{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden slide-up-animation">
            <div class="card-header bg-primary text-white text-center py-4 border-0">
                <i class="fas fa-key fa-3x mb-2"></i>
                <h4 class="mb-0 fw-bold">Forgot Password</h4>
            </div>
            <div class="card-body p-5">
                <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                    <div class="mb-4">
                        <label for="email" class="form-label text-muted fw-bold">Email address</label>
                        <div class="input-group input-group-lg shadow-sm">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-primary"></i></span>
                            <input type="email" class="form-control border-start-0 bg-light" id="email" name="email" required placeholder="Enter your email">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="phone" class="form-label text-muted fw-bold">Phone Number</label>
                        <div class="input-group input-group-lg shadow-sm">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-phone text-primary"></i></span>
                            <input type="tel" class="form-control border-start-0 bg-light" id="phone" name="phone" required placeholder="Enter your phone number">
                        </div>
                        <div class="form-text mt-2 text-muted">We will send an OTP to this number.</div>
                    </div>
                    <div class="d-grid mt-5">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill shadow fw-bold">Send OTP</button>
                    </div>
                </form>
                <div class="text-center mt-4">
                    <p class="text-muted">Remember your password? <a href="{{ url_for('auth.login') }}" class="text-primary fw-bold text-decoration-none">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
