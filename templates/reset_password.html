{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden slide-up-animation">
            <div class="card-header bg-primary text-white text-center py-4 border-0">
                <i class="fas fa-unlock-alt fa-3x mb-2"></i>
                <h4 class="mb-0 fw-bold">Reset Password</h4>
            </div>
            <div class="card-body p-5">
                <form method="POST" action="{{ url_for('auth.reset_password') }}">
                    <div class="mb-4">
                        <label for="password" class="form-label text-muted fw-bold">New Password</label>
                        <div class="input-group input-group-lg shadow-sm">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-primary"></i></span>
                            <input type="password" class="form-control border-start-0 bg-light" id="password" name="password" required placeholder="Enter new password">
                        </div>
                    </div>
                    <div class="d-grid mt-5">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill shadow fw-bold">Update Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
